<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profissionais — Mineiro Barbershop</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* ====== Estilo do card (pixel-perfect com o mock) ====== */
    .pro-list{display:grid;gap:12px;padding:12px}
    .pro-card{background:#111214;border:1px solid #1e222a;border-radius:14px;padding:12px}
    .pro-row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
    .pro-thumb{width:48px;height:48px;border-radius:12px;overflow:hidden;background:#0b0d10;border:1px solid #232831;display:grid;place-items:center;font:600 14px/1 Poppins;color:#d1d5db;user-select:none}
    .pro-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .pro-meta h3{margin:0 0 4px;font:600 14px/1.2 Poppins;color:#fff;display:flex;align-items:center;gap:6px}
    .pro-sub{color:#9ca3af;font:12px/1.3 Poppins}
    .pro-badge{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 Poppins;color:#1b1c20;background:#d3a85b;border-radius:999px;padding:3px 7px}
    .pro-badge svg{width:11px;height:11px}
    .pro-choose{border:1px solid #2a2f37;background:#16181d;color:#e5e7eb;font:600 13px/1 Poppins;border-radius:999px;padding:6px 14px;cursor:pointer;transition:background .2s,color .2s}
    .pro-choose:hover{background:#1f2329}
    .pro-choose.is-on{background:#d3a85b;color:#111;border-color:#d3a85b}
    /* acessibilidade: card inteiro clicável sem bloquear botões */
    .pro-card .click-area{position:absolute;inset:0;border-radius:14px}
    .pro-card{position:relative}
    .pro-card .pro-choose{position:relative;z-index:2}
    /* ripple simples (usa animação global se já existir) */
    .r{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:rgba(211,168,91,.25);width:24px;height:24px;pointer-events:none;opacity:.9;animation:ripple-kf .6s ease-out forwards}
    @keyframes ripple-kf{to{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
    /* barra inferior */
    .pro-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(428px,94vw);display:grid;grid-template-columns:1fr auto auto;gap:10px;background:var(--panel-2,#0f1115);border:1px solid var(--line,#22262e);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow,0 6px 24px rgba(0,0,0,.35))}
    .pro-bar .summary{align-self:center;color:#cfd2d8;font:500 13px/1.2 Poppins}
  </style>
</head>
<body>

<main class="app professionals-page" aria-labelledby="title">
  <header class="topbar">
    <a class="back ripple" href="services.html" aria-label="Voltar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <h1 id="title">Profissionais</h1>
  </header>

  <section class="pro-list" id="proList" aria-label="Lista de profissionais"></section>

  <div class="pro-bar">
    <div class="summary" id="sum">R$ 0,00 • 0 serviço • 0 min</div>
    <button class="btn ripple" id="btnBack" type="button">Voltar</button>
    <button class="btn btn-primary ripple" id="btnNext" type="button" disabled>Continuar</button>
  </div>
</main>

<script>
/* ================== Config ================== */
const N8N_PROS_URLS = [
  'https://primary-jow9-barber.up.railway.app/webhook/professionals',
  'https://primary-jow9-barber.up.railway.app/webhook/profissionals', // fallback
];

/* ================== Utils ================== */
const moneyBR = v => 'R$ ' + Number(v||0).toFixed(2).replace('.', ',');
const getStore = k => localStorage.getItem(k) ?? sessionStorage.getItem(k);
const initials = n => (n||' ').trim().split(/\s+/).slice(0,2).map(p=>p[0]?.toUpperCase()||'').join('');

/* ================== Estado vindo de Serviços ================== */
const total   = Number(getStore('svc.total')   || 0);
const minutes = Number(getStore('svc.minutes') || 0);
const count   = Number(getStore('svc.count')   || 0);
document.getElementById('sum').textContent = `${moneyBR(total)} • ${count} serviço${count>1?'s':''} • ${minutes} min`;

/* ================== Ripple ================== */
document.addEventListener('click',(e)=>{
  const t=e.target.closest('.ripple'); if(!t) return;
  const r=document.createElement('span'); r.className='r';
  const b=t.getBoundingClientRect(); r.style.left=(e.clientX-b.left)+'px'; r.style.top=(e.clientY-b.top)+'px';
  t.appendChild(r); r.addEventListener('animationend',()=>r.remove(),{once:true});
},{passive:true});

/* ================== Fetch profissionais (n8n) ================== */
async function fetchProfessionals() {
  let lastErr;
  for (const base of N8N_PROS_URLS) {
    try {
      const url = new URL(base);
      url.searchParams.set('limit','500');
      url.searchParams.set('_', String(Date.now()));
      const res = await fetch(url.toString());
      if (!res.ok) { lastErr = new Error(`${res.status}`); continue; }

      const body = await res.json().catch(()=> ({}));
      let items = [];
      if (Array.isArray(body)) items = body.map(x => x?.json ?? x);
      else if (body?.data && Array.isArray(body.data)) items = body.data;
      else if (body && typeof body === 'object') {
        const vals = Object.values(body);
        if (vals.length && typeof vals[0] === 'object') items = vals.map(v => v?.json ?? v);
      }

      items = (items || []).filter(p => (p.is_active ?? true));
      items.sort((a,b)=> String(a.full_name||a.name||'').localeCompare(String(b.full_name||b.name||'')));
      return items;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Falha ao obter profissionais');
}

/* ================== Render lista ================== */
function renderPros(pros) {
  const wrap = document.getElementById('proList');
  if (!pros.length) {
    wrap.innerHTML = `<div class="empty">Nenhum profissional disponível no momento.</div>`;
    return;
  }

  wrap.innerHTML = pros.map((p, idx) => {
    const id    = p.id || p.profile_id || p.slug || p.email || `pro_${idx}`;
    const name  = (p.full_name || p.name || 'Profissional').trim();
    const role  = (p.role || 'professional').trim();
    const phone = (p.phone || '').trim();
    const img   = p.avatar_url || p.image_url || '';
    const rate  = Number(p.rating_avg ?? 0).toFixed(1);

    return `
      <article class="pro-card" data-id="${id}" tabindex="0" aria-label="${name}">
        <div class="pro-row">
          <figure class="pro-thumb">
            ${img 
              ? `<img src="${img}" alt="${name}" onerror="this.remove()">` 
              : initials(name)}
          </figure>
          <div class="pro-meta">
            <h3>${name}
              <span class="pro-badge" title="Nota">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>${rate}
              </span>
            </h3>
            <div class="pro-sub">${role}${phone ? '<br>'+phone : ''}</div>
          </div>
          <button class="pro-choose ripple" type="button">Escolher</button>
        </div>
        <button class="click-area" type="button" aria-hidden="true"></button>
      </article>
    `;
  }).join('');

  bindSelection();
}

/* ================== Seleção / CTA ================== */
function bindSelection() {
  const btnNext  = document.getElementById('btnNext');
  const btnBack  = document.getElementById('btnBack');

  const cards = [...document.querySelectorAll('.pro-card')].map(el => ({
    id: el.dataset.id,
    el,
    chooseBtn: el.querySelector('.pro-choose'),
    clickArea: el.querySelector('.click-area')
  }));

  const selected = new Set();

  function syncUI(){
    cards.forEach(c => c.chooseBtn.classList.toggle('is-on', selected.has(c.id)));
    btnNext.disabled = selected.size === 0;
    btnNext.textContent = selected.size ? `Continuar (${selected.size})` : 'Continuar';
  }
  syncUI();

  cards.forEach(c => {
    const toggle = () => { selected.has(c.id) ? selected.delete(c.id) : selected.add(c.id); syncUI(); };
    c.chooseBtn.addEventListener('click', toggle);
    c.clickArea.addEventListener('click', toggle);
    c.el.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); toggle(); }});
  });

  btnNext.addEventListener('click', () => {
    if (selected.size === 0) return;
    localStorage.setItem('selectedPros', JSON.stringify([...selected]));
    localStorage.setItem('proMode', 'per'); // multi por serviço
    window.location.href = 'agendamentos.html';
  });
  btnBack.addEventListener('click', () => window.location.href = 'services.html');
}

/* ================== Boot ================== */
(async function boot(){
  try{
    const pros = await fetchProfessionals();
    renderPros(pros);
  }catch(err){
    console.error(err);
    document.getElementById('proList').innerHTML =
      `<div class="error" role="alert">Não foi possível carregar os profissionais. Tente novamente.</div>`;
  }
})();
</script>
</body>
</html>
