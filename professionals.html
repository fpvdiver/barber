<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profissionais — Mineiro Barbershop</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* ===== reforço visual dos cards (não depende do styles.css) ===== */
    .list{ display:grid; gap:12px; padding:12px }
    .list .item{
      display:grid; grid-template-columns:56px 1fr auto; gap:12px; align-items:center;
      background:var(--panel, #111214); border:1px solid var(--line, #1e222a);
      border-radius:14px; padding:12px;
    }
    .thumb{
      width:56px; height:56px; border-radius:12px; overflow:hidden;
      background:#0b0d10; border:1px solid #232831; display:grid; place-items:center;
      font:600 14px/1 Poppins; color:#d1d5db; user-select:none;
    }
    .thumb img{ width:100%; height:100%; object-fit:cover; display:block }
    .meta .name{ margin:0 0 4px; font:600 14px/1.2 Poppins; color:#fff }
    .meta .desc{ margin:0; color:#aeb3bb; font:12px/1.35 Poppins; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:65vw }
    .rate{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font:600 11px/1 Poppins;color:#1b1c20;background:#d3a85b;border-radius:999px;padding:3px 7px}
    .rate svg{width:11px;height:11px}

    .choose{
      border:1px solid #2a2f37; background:#16181d; color:#e5e7eb;
      font:600 13px/1 Poppins; border-radius:999px; padding:8px 14px; cursor:pointer;
      transition:background .2s,color .2s,border-color .2s; white-space:nowrap;
    }
    .choose.is-on{ background:#d3a85b; color:#111; border-color:#d3a85b }
    .choose:disabled{ opacity:.5; cursor:not-allowed }

    /* barra inferior */
    .pro-bar{
      position:fixed; left:50%; transform:translateX(-50%); bottom:10px; width:min(428px,94vw);
      display:grid; grid-template-columns:1fr auto auto; gap:10px;
      background:var(--panel-2,#0f1115); border:1px solid var(--line,#22262e);
      border-radius:14px; padding:10px 12px; box-shadow:0 6px 24px rgba(0,0,0,.35);
    }
    .pro-bar .summary{ align-self:center; color:#cfd2d8; font:500 13px/1.2 Poppins }

    /* ripple básico */
    .r{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:rgba(211,168,91,.25);width:24px;height:24px;pointer-events:none;opacity:.9;animation:ripple-kf .6s ease-out forwards}
    @keyframes ripple-kf{to{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
  </style>
</head>
<body>

<main class="app professionals-page" aria-labelledby="title">
  <!-- Topbar -->
  <header class="topbar">
    <a class="back ripple" href="services.html" aria-label="Voltar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <h1 id="title">Profissionais</h1>
  </header>

  <!-- Lista (render via JS) -->
  <section class="list" id="proList" aria-label="Lista de profissionais"></section>

  <!-- Rodapé com resumo e ações -->
  <div class="pro-bar">
    <div class="summary" id="sum">R$ 0,00 • 0 serviço • 0 min</div>
    <button class="btn ripple" id="btnBack" type="button">Voltar</button>
    <button class="btn btn-primary ripple" id="btnNext" type="button" disabled>Continuar</button>
  </div>
</main>

<script>
/* ================== Config ================== */
const N8N_PROS_URLS = [
  'https://primary-jow9-barber.up.railway.app/webhook/professionals',
  'https://primary-jow9-barber.up.railway.app/webhook/profissionals', // fallback se seu fluxo usa esse path
];

/* ================== Utils ================== */
const moneyBR = v => 'R$ ' + Number(v||0).toFixed(2).replace('.', ',');
const getStore = k => localStorage.getItem(k) ?? sessionStorage.getItem(k);
const initials = n => (n||' ').trim().split(/\s+/).slice(0,2).map(p=>p[0]?.toUpperCase()||'').join('');

/* ================== Estado vindo de Serviços ================== */
const total   = Number(getStore('svc.total')   || 0);
const minutes = Number(getStore('svc.minutes') || 0);
const count   = Number(getStore('svc.count')   || 0);
document.getElementById('sum').textContent = `${moneyBR(total)} • ${count} serviço${count>1?'s':''} • ${minutes} min`;

/* ================== Ripple ================== */
document.addEventListener('click',(e)=>{
  const t=e.target.closest('.ripple'); if(!t) return;
  const r=document.createElement('span'); r.className='r';
  const b=t.getBoundingClientRect(); r.style.left=(e.clientX-b.left)+'px'; r.style.top=(e.clientY-b.top)+'px';
  t.appendChild(r); r.addEventListener('animationend',()=>r.remove(),{once:true});
},{passive:true});

/* ================== Reveal (suave) ================== */
function applyReveal() {
  const obs = new IntersectionObserver((ents)=>{
    ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('is-in'); obs.unobserve(e.target); } });
  }, {threshold:.12, rootMargin:"0px 0px -40px 0px"});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
}

/* ================== Fetch profissionais (n8n) ================== */
async function fetchProfessionals() {
  let lastErr;
  for (const base of N8N_PROS_URLS) {
    try {
      const url = new URL(base);
      url.searchParams.set('limit','500');
      url.searchParams.set('_', String(Date.now()));
      const res = await fetch(url.toString(), { method:'GET' });
      if (!res.ok) { lastErr = new Error(`${res.status}`); continue; }
      const body = await res.json().catch(()=> ({}));

      // normaliza formatos
      let items = [];
      if (Array.isArray(body)) items = body.map(x => x?.json ?? x);
      else if (body?.data && Array.isArray(body.data)) items = body.data;
      else if (body && typeof body === 'object') {
        const vals = Object.values(body);
        if (vals.length && typeof vals[0] === 'object') items = vals.map(v => v?.json ?? v);
      }

      // Só ativos e ordena por nome
      items = (items || []).filter(p => (p.is_active ?? true));
      items.sort((a,b)=> String(a.full_name||a.name||'').localeCompare(String(b.full_name||b.name||'')));

      return items;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Falha ao obter profissionais');
}

/* ================== Render lista ================== */
function renderPros(pros) {
  const wrap = document.getElementById('proList');
  if (!pros.length) {
    wrap.innerHTML = `<div class="empty">Nenhum profissional disponível no momento.</div>`;
    return;
  }

  wrap.innerHTML = pros.map((p, idx) => {
    const id    = p.id || p.profile_id || p.slug || p.email || `pro_${idx}`;
    const name  = (p.full_name || p.name || 'Profissional').trim();
    const role  = (p.role || 'professional').trim();
    const phone = (p.phone || '').trim();
    const img   = p.avatar_url || p.image_url || '';   // pode vir vazio
    const rate  = (p.rating_avg != null) ? Number(p.rating_avg).toFixed(1) : '0.0';

    return `
      <article class="item reveal" data-id="${id}">
        <figure class="thumb" data-initials="${initials(name)}">
          ${img ? `<img src="${img}" alt="${name}">` : `${initials(name)}`}
        </figure>
        <div class="meta">
          <h3 class="name">
            ${name}
            <span class="rate" title="Nota">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
              </svg>${rate}
            </span>
          </h3>
          <p class="desc">${role}${phone ? ' • ' + phone : ''}</p>
        </div>
        <button class="choose ripple" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>Escolher</span>
        </button>
      </article>`;
  }).join('');

  // fallback de imagem => mostra iniciais
  document.querySelectorAll('.thumb img').forEach(img=>{
    img.addEventListener('error', ()=>{
      const box = img.parentElement;
      const ini = box.getAttribute('data-initials') || '—';
      img.remove();
      box.textContent = ini;
    });
  });

  applyReveal();
}

/* ================== Seleção / CTA ================== */
function bindSelection() {
  const btnNext  = document.getElementById('btnNext');
  const btnBack  = document.getElementById('btnBack');
  const items = [...document.querySelectorAll('#proList .item')].map(el => ({
    id: el.dataset.id,
    btn: el.querySelector('.choose'),
    el
  }));
  const selected = new Set();

  function syncUI(){
    items.forEach(c => c.btn.classList.toggle('is-on', selected.has(c.id)));
    btnNext.disabled = selected.size === 0;
    btnNext.textContent = selected.size ? `Continuar (${selected.size})` : 'Continuar';
  }
  syncUI();

  items.forEach(c => {
    c.btn.addEventListener('click', () => {
      selected.has(c.id) ? selected.delete(c.id) : selected.add(c.id);
      syncUI();
    });
    // acessibilidade: ENTER/ESPAÇO no card também seleciona
    c.el.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); c.btn.click(); }
    });
    c.el.tabIndex = 0;
  });

  btnNext.addEventListener('click', () => {
    if (selected.size === 0) return;
    localStorage.setItem('selectedPros', JSON.stringify([...selected]));
    localStorage.setItem('proMode', 'per'); // multi por serviço
    window.location.href = 'agendamentos.html';
  });

  btnBack.addEventListener('click', () => window.location.href = 'services.html');
}

/* ================== Boot ================== */
(async function boot(){
  try{
    const pros = await fetchProfessionals();
    renderPros(pros);
    bindSelection();
  }catch(err){
    console.error(err);
    document.getElementById('proList').innerHTML =
      `<div class="error" role="alert">Não foi possível carregar os profissionais. Tente novamente.</div>`;
  }
})();
</script>
</body>
</html>
