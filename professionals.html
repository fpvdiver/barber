<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profissionais — Mineiro Barbershop</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ==== Card de profissionais (NOMES ÚNICOS p/ não colidir com o tema) ==== */
    .pro-list { display: grid; gap: 12px; padding: 12px; }
    .pro-card {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
    }
    .pro-row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 12px;
      align-items: center;
      min-height: 64px;
      position: relative;
      z-index: 1; /* acima de qualquer overlay genérico do tema */
    }
    .pro-thumb {
      width: 64px; height: 64px; border-radius: 12px; overflow: hidden;
      border: 1px solid var(--line); background: #0f1012;
      display: grid; place-items: center;
      user-select: none;
    }
    .pro-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pro-thumb.no-img span { color:#d8dae2; font:700 16px/1 Poppins; }

    .pro-meta h3 {
      margin: 0 0 4px;
      font: 600 16px/1.2 Poppins;
      display: flex; align-items: center; gap: 8px;
    }
    .pro-sub { color: var(--muted); font-size: 13px; line-height: 1.2; }
    .pro-sub .sep { margin: 0 6px; opacity: .35; }

    .pro-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font: 700 12px/1 Poppins; color: #1b1c20;
      background: #d3a85b; border-radius: 999px; padding: 6px 10px;
      white-space: nowrap;
    }
    .pro-badge svg { width: 12px; height: 12px; }

    .pro-choose {
      position: relative; z-index: 2;
      height: 40px; padding: 0 16px; border-radius: 999px;
      border: 1px solid var(--line); background: #15161a; color: #e9eaef;
      font: 600 14px/1 Poppins; cursor: pointer;
    }
    .pro-choose.is-on {
      background: var(--gold); color: #111; border-color: transparent;
    }
    .pro-card.is-disabled { opacity: .55; }
    .pro-card.is-disabled .pro-choose { pointer-events: none; }

    /* ripple local (não usa .ripple global para evitar overlays do tema) */
    .rip {position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);
      background:rgba(211,168,91,.25);width:24px;height:24px;pointer-events:none;opacity:.9;
      animation:r-kf 600ms ease-out forwards}
    @keyframes r-kf{to{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
  </style>
</head>
<body>

<main class="app professionals-page" aria-labelledby="title">
  <header class="topbar">
    <a class="back ripple" href="services.html" aria-label="Voltar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <h1 id="title">Profissionais</h1>
  </header>

  <section class="pro-list" id="proList" aria-label="Lista de profissionais"></section>

  <div class="pro-bar">
    <div class="summary" id="sum">R$ 0,00 • 0 serviço • 0 min</div>
    <button class="btn ripple" id="btnBack" type="button">Voltar</button>
    <button class="btn btn-primary ripple" id="btnNext" type="button" disabled>Continuar</button>
  </div>
</main>

<script>
/* ================== Config ================== */
const N8N_PROS_URLS = [
  'https://primary-jow9-barber.up.railway.app/webhook/professionals',
  'https://primary-jow9-barber.up.railway.app/webhook/profissionals'
];

/* ================== Utils ================== */
const moneyBR = v => 'R$ ' + Number(v||0).toFixed(2).replace('.', ',');
const getStore = k => localStorage.getItem(k) ?? sessionStorage.getItem(k);
const initials = (n) => (String(n||' ').trim().split(/\s+/).slice(0,2).map(p=>p[0]?.toUpperCase()||'').join('') || 'MB');

/* ================== Estado vindo de Serviços ================== */
const REQUIRED = new Set(JSON.parse(getStore('svc.selected') || '[]'));
const total   = Number(getStore('svc.total')   || 0);
const minutes = Number(getStore('svc.minutes') || 0);
const count   = Number(getStore('svc.count')   || 0);
document.getElementById('sum').textContent = `${moneyBR(total)} • ${count} serviço${count>1?'s':''} • ${minutes} min`;

/* ================== Ripple local ================== */
function addRip(e, target){
  const b = target.getBoundingClientRect();
  const s = document.createElement('span');
  s.className='rip';
  s.style.left = (e.clientX - b.left)+'px';
  s.style.top  = (e.clientY - b.top )+'px';
  target.appendChild(s);
  s.addEventListener('animationend',()=>s.remove(),{once:true});
}

/* ================== Reveal ================== */
function applyReveal() {
  const obs = new IntersectionObserver((ents)=>{
    ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('is-in'); obs.unobserve(e.target); } });
  }, {threshold:.12, rootMargin:"0px 0px -40px 0px"});
  document.querySelectorAll('.pro-card').forEach(el=>obs.observe(el));
}

/* ================== Fetch profissionais (n8n) ================== */
async function fetchProfessionals() {
  let lastErr;
  for (const base of N8N_PROS_URLS) {
    try {
      const url = new URL(base);
      url.searchParams.set('limit','500');
      url.searchParams.set('_', String(Date.now()));
      const res = await fetch(url.toString(), { method:'GET' });
      if (!res.ok) { lastErr = new Error(`${res.status}`); continue; }
      const body = await res.json().catch(()=> ({}));

      let items = [];
      if (Array.isArray(body)) items = body.map(x => x?.json ?? x);
      else if (body?.data && Array.isArray(body.data)) items = body.data;
      else if (body && typeof body === 'object') {
        const vals = Object.values(body);
        if (vals.length && typeof vals[0] === 'object') items = vals.map(v => v?.json ?? v);
      }

      items = (items || []).filter(p => (p.is_active ?? true));
      items.sort((a,b)=> String(a.full_name||a.name||'').localeCompare(String(b.full_name||b.name||'')));

      return items;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Falha ao obter profissionais');
}

/* ================== Cobre serviços requeridos? ================== */
function proCoversRequired(pro, required) {
  const pool = new Set();
  (pro.skills || pro.tags || []).forEach(x => pool.add(String(x)));
  (pro.service_ids || []).forEach(x => pool.add(String(x)));
  if (!required || !required.size) return true;
  for (const r of required) if (pool.has(String(r))) return true;
  return false;
}

/* ================== Render ================== */
function renderPros(pros) {
  const wrap = document.getElementById('proList');
  if (!pros.length) {
    wrap.innerHTML = `<div class="empty">Nenhum profissional disponível no momento.</div>`;
    return;
  }

  wrap.innerHTML = pros.map(p => {
    const id    = p.id || p.profile_id || p.slug || p.email || crypto.randomUUID();
    const name  = p.full_name || p.name || 'Profissional';
    const rate  = (p.rating_avg != null) ? Number(p.rating_avg||0).toFixed(1) : '0.0';
    const role  = p.role || 'professional';
    const phone = p.phone || '';
    const imgUrl = p.avatar_url || p.image_url || '';
    const disabled = !proCoversRequired(p, REQUIRED);

    return `
      <article class="pro-card ${disabled ? 'is-disabled':''}" data-id="${id}">
        <div class="pro-row">
          <figure class="pro-thumb ${imgUrl ? '' : 'no-img'}">
            ${imgUrl ? `<img src="${imgUrl}" alt="${name}">` : `<span>${initials(name)}</span>`}
          </figure>

          <div class="pro-meta">
            <h3>${name}
              <span class="pro-badge" title="Avaliação ${rate}">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
                ${rate}
              </span>
            </h3>
            <div class="pro-sub">
              ${role}
              ${phone ? `<span class="sep">•</span><span class="phone">${phone}</span>` : ''}
            </div>
          </div>

          <button class="pro-choose" type="button" aria-pressed="false" ${disabled ? 'disabled':''}>
            Escolher
          </button>
        </div>
      </article>`;
  }).join('');

  // fallback de imagem
  document.querySelectorAll('.pro-thumb img').forEach(img=>{
    img.addEventListener('error', ()=>{
      const box=img.parentElement; img.remove(); box.classList.add('no-img');
      const who = img.getAttribute('alt') || 'Profissional';
      const sp = document.createElement('span'); sp.textContent = initials(who);
      box.appendChild(sp);
    });
  });

  applyReveal();
}

/* ================== Seleção / CTA ================== */
function bindSelection() {
  const btnNext  = document.getElementById('btnNext');
  const btnBack  = document.getElementById('btnBack');
  const items = [...document.querySelectorAll('#proList .pro-card')].map(el => ({
    id: el.dataset.id,
    btn: el.querySelector('.pro-choose'),
    el
  }));
  const selected = new Set();

  function syncUI(){
    items.forEach(c => c.btn.classList.toggle('is-on', selected.has(c.id)));
    btnNext.disabled = selected.size === 0;
    btnNext.textContent = selected.size ? `Continuar (${selected.size})` : 'Continuar';
  }
  syncUI();

  // clique no botão (sempre por cima do layout)
  items.forEach(c => {
    c.btn.addEventListener('click', (ev) => {
      addRip(ev, c.btn);
      if (c.el.classList.contains('is-disabled') || c.btn.hasAttribute('disabled')) return;
      selected.has(c.id) ? selected.delete(c.id) : selected.add(c.id);
      c.btn.setAttribute('aria-pressed', selected.has(c.id) ? 'true' : 'false');
      syncUI();
    });

    // clique no card inteiro também seleciona (sem interferir no botão)
    c.el.addEventListener('click', (ev) => {
      if (ev.target.closest('.pro-choose')) return; // já tratado acima
      if (c.el.classList.contains('is-disabled')) return;
      selected.has(c.id) ? selected.delete(c.id) : selected.add(c.id);
      c.btn.classList.toggle('is-on', selected.has(c.id));
      c.btn.setAttribute('aria-pressed', selected.has(c.id) ? 'true' : 'false');
      syncUI();
    });
  });

  btnNext.addEventListener('click', () => {
    if (selected.size === 0) return;
    localStorage.setItem('selectedPros', JSON.stringify([...selected]));
    localStorage.setItem('proMode', 'per');
    window.location.href = 'agendamentos.html';
  });

  btnBack.addEventListener('click', () => window.location.href = 'services.html');
}

/* ================== Boot ================== */
(async function boot(){
  try{
    const pros = await fetchProfessionals();
    renderPros(pros);
    bindSelection();
  }catch(err){
    console.error(err);
    document.getElementById('proList').innerHTML =
      `<div class="error" role="alert">Não foi possível carregar os profissionais. Tente novamente.</div>`;
  }
})();
</script>
</body>
</html>
