<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin • Serviços — Mineiro Barbershop</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .wrap{max-width:980px;margin:0 auto;padding:16px 14px 120px}
    .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
    h1{font:700 18px/1 Poppins;margin:0 0 12px}
    h2{font:600 14px/1 Poppins;margin:0 0 10px}
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
    .table{width:100%;border-collapse:separate;border-spacing:0 10px}
    .row{display:grid;grid-template-columns:64px 1fr 120px 100px 120px 110px;gap:10px;align-items:center;border:1px solid var(--line);background:#141416;border-radius:12px;padding:8px 10px}
    .thumb{width:64px;height:64px;border-radius:10px;border:1px solid var(--line);overflow:hidden;background:#0f1013;display:grid;place-items:center;color:#cbd5e1;font:600 12px}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .title{font:600 14px/1.2 Poppins;margin:0}
    .muted{color:#9aa0a6;font:12px}
    .btn{border:1px solid var(--line);background:#1b1c20;color:#e6e7ea;padding:8px 12px;border-radius:10px;font:600 12px/1 Poppins;cursor:pointer}
    .btn.primary{border-color:#7b6335;background:linear-gradient(180deg,var(--gold),var(--gold-2));color:#111}
    .btn.danger{background:#1a1112;border-color:#3c1a1b;color:#ffcccc}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .field{margin:0 0 10px}
    .label{display:block;margin:0 0 6px;font:600 12px/1 Poppins;letter-spacing:.12em;text-transform:uppercase;color:#d9dade}
    .input, .select, .textarea{width:100%;background:#111214;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;font:15px/1.4 Poppins;outline:0}
    .row-actions{display:flex;gap:8px;justify-content:flex-end}
    .img-picker{display:flex;gap:10px;align-items:center}
    .img-preview{width:88px;height:88px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#0f1013;display:grid;place-items:center;color:#cbd5e1;font:600 12px}
    .img-preview img{width:100%;height:100%;object-fit:cover}
    .help{font-size:12px;color:#a5abb3}
    .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
    .on{background:#58d38c}.off{background:#6b7280}
    .msg{margin-top:6px;font-size:13px}
    .ok{color:#c6f7d0}.err{color:#ffd0d0}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <a class="back ripple" href="../index.html" aria-label="Voltar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <h1>Admin • Serviços</h1>
  </header>

  <div class="wrap grid">
    <!-- Lista -->
    <section class="panel">
      <div class="toolbar">
        <button class="btn primary" id="btnNew">Novo serviço</button>
        <span class="help">Clique em “Editar” para trocar nome, preço, duração e imagem.</span>
      </div>
      <div id="list"></div>
    </section>

    <!-- Form -->
    <aside class="panel">
      <h2 id="formTitle">Novo serviço</h2>
      <form id="formSvc" novalidate>
        <input type="hidden" id="svcId">
        <div class="field">
          <label class="label" for="svcName">Nome</label>
          <input class="input" id="svcName" required>
        </div>
        <div class="field">
          <label class="label" for="svcCategory">Categoria (opcional)</label>
          <input class="input" id="svcCategory" placeholder="UUID ou deixe vazio">
        </div>
        <div class="field">
          <label class="label" for="svcMinutes">Duração (min)</label>
          <input class="input" id="svcMinutes" type="number" min="5" step="5" required>
        </div>
        <div class="field">
          <label class="label" for="svcPrice">Preço (R$)</label>
          <input class="input" id="svcPrice" type="number" min="0" step="0.01" required>
        </div>
        <div class="field">
          <label class="label">Imagem do serviço</label>
          <div class="img-picker">
            <div class="img-preview" id="imgPrev">Prévia</div>
            <div>
              <input type="file" id="imgFile" accept="image/*">
              <div class="help">Será enviado para o bucket <b>services/</b></div>
            </div>
          </div>
        </div>
        <div class="field">
          <label class="label" for="svcActive">Ativo?</label>
          <select class="select" id="svcActive">
            <option value="true" selected>Sim</option>
            <option value="false">Não</option>
          </select>
        </div>

        <div class="row-actions" style="margin-top:10px">
          <button class="btn" type="button" id="btnReset">Limpar</button>
          <button class="btn primary" type="submit" id="btnSave">Salvar</button>
        </div>
        <div class="msg" id="formMsg"></div>
      </form>
    </aside>
  </div>
</main>

<script>
/* ====== CONFIG ====== */
const SUPABASE_URL = 'https://rlhrnmzlfiyyycrhggjv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsaHJubXpsZml5eXljcmhnZ2p2Iiwicm9sZSI6InNlcnZpY2Vfcm9zZSIsImlhdCI6MTc1ODM2OTQ5MSwiZXhwIjoyMDczOTQ1NDkxfQ.tF5FGlO9vzK72LF0lUz5nZgevstzmQTePZEudrYM61Y';
const STORAGE_BUCKET = 'services';

/* ====== SESSION GUARD (mesmo padrão das outras páginas) ====== */
function getSbSession() {
  const custom = localStorage.getItem('sb.session');
  if (custom) try {
    const s = JSON.parse(custom);
    return { access_token: s.access_token||s.token||'', user_id: s.user_id||s.user?.id||'', user: s.user||null };
  } catch {}
  const ref = SUPABASE_URL.split('https://')[1].split('.')[0];
  const raw = localStorage.getItem(`sb-${ref}-auth-token`);
  if (raw) try {
    const p = JSON.parse(raw), sess = p?.currentSession || p;
    return { access_token: sess?.access_token||'', user_id: sess?.user?.id||'', user: sess?.user||null };
  } catch {}
  return null;
}
const sb = getSbSession();
if (!sb?.access_token) {
  sessionStorage.setItem('postLoginRedirect','admin/services.html');
  location.href = '../login.html';
}

/* ====== UTILS ====== */
const money = v => 'R$ ' + Number(v||0).toFixed(2).replace('.', ',');
const qs = s => document.querySelector(s);
const listEl = qs('#list');
const imgPrev = qs('#imgPrev');
const imgFile = qs('#imgFile');
const formMsg = qs('#formMsg');

/* ====== LOAD LIST ====== */
async function fetchServices() {
  const url = new URL(`${SUPABASE_URL}/rest/v1/services`);
  url.searchParams.set('select','id,name,minutes,price_cents,is_active,image_url,slug');
  url.searchParams.set('order','created_at.desc');
  const res = await fetch(url, { headers:{ apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${sb.access_token}` } });
  if (!res.ok) throw new Error(await res.text());
  return await res.json();
}

function renderList(items){
  listEl.innerHTML = '';
  if (!items.length) {
    listEl.innerHTML = `<div class="help">Nenhum serviço cadastrado.</div>`;
    return;
  }
  items.forEach(s=>{
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <figure class="thumb">${s.image_url ? `<img src="${s.image_url}" alt="">` : 'Sem<br>imagem'}</figure>
      <div>
        <div class="title">${s.name}</div>
        <div class="muted">${s.slug || ''}</div>
      </div>
      <div class="muted">${s.minutes} min</div>
      <div class="muted">${money((s.price_cents||0)/100)}</div>
      <div class="muted"><span class="status-dot ${s.is_active?'on':'off'}"></span>${s.is_active?'Ativo':'Inativo'}</div>
      <div class="row-actions">
        <button class="btn" data-edit="${s.id}">Editar</button>
        <button class="btn danger" data-del="${s.id}">Excluir</button>
      </div>
    `;
    listEl.appendChild(row);
  });
}

async function loadList(){
  const data = await fetchServices();
  renderList(data);
}

/* ====== IMAGE UPLOAD ====== */
let currentImageBlob = null;
imgFile.addEventListener('change', (e)=>{
  const f = e.target.files?.[0];
  if (!f) { currentImageBlob = null; imgPrev.innerHTML = 'Prévia'; return; }
  currentImageBlob = f;
  const url = URL.createObjectURL(f);
  imgPrev.innerHTML = `<img src="${url}" alt="">`;
});

async function uploadImageToStorage(serviceId, file){
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const safeExt = ({jpeg:'jpg'}[ext] || ext);
  const path = `${serviceId}/${Date.now()}.${safeExt}`;
  const put = await fetch(`${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${encodeURIComponent(path)}`, {
    method:'POST',
    headers:{
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${sb.access_token}`,
      'x-upsert':'true',
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });
  if(!put.ok) throw new Error(await put.text());
  const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${encodeURIComponent(path)}`;
  return { path, publicUrl };
}

/* ====== CRUD ====== */
function resetForm(){
  qs('#svcId').value = '';
  qs('#svcName').value = '';
  qs('#svcCategory').value = '';
  qs('#svcMinutes').value = 30;
  qs('#svcPrice').value = 0;
  qs('#svcActive').value = 'true';
  imgFile.value = '';
  imgPrev.innerHTML = 'Prévia';
  currentImageBlob = null;
  qs('#formTitle').textContent = 'Novo serviço';
  formMsg.textContent = '';
  formMsg.className = 'msg';
}
qs('#btnReset').addEventListener('click', resetForm);
qs('#btnNew').addEventListener('click', resetForm);

listEl.addEventListener('click', async (e)=>{
  const btnEdit = e.target.closest('button[data-edit]');
  const btnDel  = e.target.closest('button[data-del]');
  if (btnEdit){
    const id = btnEdit.dataset.edit;
    const url = new URL(`${SUPABASE_URL}/rest/v1/services`);
    url.searchParams.set('select','*');
    url.searchParams.set('id',`eq.${id}`);
    const r = await fetch(url, { headers:{ apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${sb.access_token}` } });
    const [s] = await r.json();
    qs('#svcId').value = s.id;
    qs('#svcName').value = s.name || '';
    qs('#svcCategory').value = s.category_id || '';
    qs('#svcMinutes').value = s.minutes || s.duration_min || 30;
    qs('#svcPrice').value = (s.price_cents||0)/100;
    qs('#svcActive').value = String(!!s.is_active);
    imgPrev.innerHTML = s.image_url ? `<img src="${s.image_url}" alt="">` : 'Prévia';
    currentImageBlob = null;
    qs('#formTitle').textContent = 'Editar serviço';
    window.scrollTo({top:0,behavior:'smooth'});
  }
  if (btnDel){
    const id = btnDel.dataset.del;
    if (!confirm('Excluir este serviço?')) return;
    const url = new URL(`${SUPABASE_URL}/rest/v1/services`);
    url.searchParams.set('id',`eq.${id}`);
    const del = await fetch(url, {
      method:'DELETE',
      headers:{ apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${sb.access_token}` }
    });
    if(!del.ok){ alert('Falha ao excluir.'); return; }
    await loadList();
  }
});

qs('#formSvc').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const id = qs('#svcId').value.trim();
  const name = qs('#svcName').value.trim();
  const minutes = Number(qs('#svcMinutes').value);
  const price_cents = Math.round(Number(qs('#svcPrice').value) * 100);
  const category_id = qs('#svcCategory').value.trim() || null;
  const is_active = qs('#svcActive').value === 'true';

  if(!name || !minutes || isNaN(price_cents)){
    formMsg.textContent = 'Preencha nome, duração e preço.'; formMsg.className='msg err'; return;
  }

  try{
    qs('#btnSave').disabled = true;

    let svcId = id;
    // create or update base fields
    if (!id){
      // INSERT
      const ins = await fetch(`${SUPABASE_URL}/rest/v1/services`, {
        method:'POST',
        headers:{
          apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${sb.access_token}`,
          'Content-Type':'application/json', Prefer:'return=representation'
        },
        body: JSON.stringify({ name, minutes, price_cents, is_active, category_id })
      });
      if(!ins.ok) throw new Error(await ins.text());
      const [row] = await ins.json();
      svcId = row.id;
    } else {
      // UPDATE
      const url = new URL(`${SUPABASE_URL}/rest/v1/services`);
      url.searchParams.set('id',`eq.${id}`);
      const upd = await fetch(url, {
        method:'PATCH',
        headers:{
          apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${sb.access_token}`,
          'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=representation'
        },
        body: JSON.stringify({ name, minutes, price_cents, is_active, category_id })
      });
      if(!upd.ok) throw new Error(await upd.text());
    }

    // upload da imagem se selecionada
    if (currentImageBlob){
      const { publicUrl } = await uploadImageToStorage(svcId, currentImageBlob);
      const u2 = new URL(`${SUPABASE_URL}/rest/v1/services`);
      u2.searchParams.set('id',`eq.${svcId}`);
      const upd2 = await fetch(u2, {
        method:'PATCH',
        headers:{
          apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${sb.access_token}`,
          'Content-Type':'application/json', Prefer:'resolution=merge-duplicates'
        },
        body: JSON.stringify({ image_url: publicUrl })
      });
      if(!upd2.ok) throw new Error(await upd2.text());
    }

    formMsg.textContent = 'Serviço salvo com sucesso!';
    formMsg.className = 'msg ok';
    await loadList();
    // mantém no modo edição se tiver id; senão limpa
    if (!id) resetForm();
  }catch(err){
    console.error(err);
    formMsg.textContent = 'Falha ao salvar. Verifique as permissões do bucket e a RLS.';
    formMsg.className = 'msg err';
  }finally{
    qs('#btnSave').disabled = false;
  }
});

/* ====== INIT ====== */
loadList();

/* ripple visual */
document.addEventListener('click',(e)=>{
  const t=e.target.closest('.ripple'); if(!t) return;
  const r=document.createElement('span'); r.className='r';
  const b=t.getBoundingClientRect(); r.style.left=(e.clientX-b.left)+'px'; r.style.top=(e.clientY-b.top)+'px';
  t.appendChild(r); r.addEventListener('animationend',()=>r.remove());
},{passive:true});
</script>
</body>
</html>
