<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil do Profissional • Mineiro Barbershop</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f10; --panel:#141416; --panel-2:#101113;
  --text:#f5f6f9; --muted:#a7aab3; --line:#22242a;
  --gold:#d3a85b; --gold-2:#b88f49; --gold-rgb:211,168,91;
  --danger:#ff4d4f; --shadow:0 18px 50px rgba(0,0,0,.35);
  --ok:#7ef7a0; --warn:#ffd166;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:#0b0c0e;color:var(--text);font:15px/1.6 Poppins,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.app{min-height:100svh;display:grid;grid-template-columns:280px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"sidebar header" "sidebar main";background:var(--bg)}
.sidebar{grid-area:sidebar;background:linear-gradient(180deg,#0f1012,#0e0f11);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100svh;display:flex;flex-direction:column;gap:14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.brand-logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#111;border:1px solid #262830;color:var(--gold);font:800 12px/1 Poppins}
.brand strong{font:700 15px/1 Poppins}
.nav{display:grid;gap:8px;margin-top:6px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#cfd0d4;text-decoration:none;border:1px solid var(--line);background:var(--panel-2)}
.nav a.active{color:var(--gold);background:rgba(var(--gold-rgb),.10);border-color:rgba(var(--gold-rgb),.35)}
.nav a svg{width:18px;height:18px}
.sidebar .spacer{flex:1}
.btn{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#1b1c20;color:#e6e7ea;font:600 12px/1 Poppins;cursor:pointer}
.btn-primary{border-color:#7b6335;background:linear-gradient(180deg,var(--gold),var(--gold-2));color:#111}
.header{grid-area:header;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,16,18,.86);backdrop-filter:blur(6px) saturate(115%);z-index:10}
.search{flex:1;min-width:0;display:grid;grid-template-columns:18px 1fr 120px;gap:10px;align-items:center;height:44px;padding:0 12px;border-radius:12px;background:#131418;border:1px solid #23252b;color:#cfd0d4}
.search input{background:transparent;border:0;outline:0;color:inherit;font:500 13px/1 Poppins}
.uinfo{display:flex;align-items:center;gap:10px;margin-left:auto}
.uinfo .avatar{width:36px;height:36px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,.1)}
.uinfo .name{font:600 13px/1 Poppins}.uinfo .tag{display:inline-grid;place-items:center;height:22px;padding:0 8px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:#111214;font:700 11px/1 Poppins;letter-spacing:.03em}

.main{grid-area:main;padding:18px;display:grid;gap:16px;grid-template-columns:1fr 1fr;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font:600 14px/1 Poppins}

.profile-card{grid-column:1/span 1;display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:center}
.profile-avatar{width:160px;height:160px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0f1013;display:grid;place-items:center}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-head h1{margin:0;font:700 22px/1.2 Poppins}
.muted{color:#a7aab3}
.rating{display:flex;align-items:center;gap:8px}
.star{width:16px;height:16px;color:#ffd166}
.kpis{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);min-width:120px}
.kpi b{font:700 16px/1.1 Poppins}

.actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.btn-whatsapp{background:#1f2a22;border-color:#2b5d3d;color:#9ef2b7}
.btn-share{background:#181a1e;border-color:#2a2e36}

.services-card{grid-column:1/span 1}
.service-row{display:grid;grid-template-columns:1fr 100px 90px 110px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:10px;margin-top:8px}
.badge{display:inline-grid;place-items:center;height:22px;padding:0 8px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:#111214;font:700 11px/1 Poppins;letter-spacing:.03em}
.badge-ok{color:#7ef7a0;border-color:rgba(126,247,160,.25);background:rgba(126,247,160,.08)}

.schedule-card{grid-column:2/span 1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:10px;min-height:92px}
.day h4{margin:0 0 6px;font:700 12px/1 Poppins;color:#cfd0d4}
.slot{font:600 12px/1.2 Poppins;color:#d9dbe2}
.slot.off{opacity:.5;text-decoration:line-through}

.reviews-card{grid-column:2/span 1}
.review{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:10px;margin-top:8px}
.reviewer{display:flex;align-items:center;gap:10px}
.reviewer .avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:#0f1013;display:grid;place-items:center;font:700 11px/1 Poppins;color:#cbd5e1}
.reviewer img{width:100%;height:100%;object-fit:cover}
.review .stars{display:flex;gap:2px;margin-left:auto}
.empty{opacity:.8}

.grid-full{grid-column:1 / -1}

@media (max-width:1024px){
  .app{grid-template-columns:88px 1fr}
  .brand strong,.nav a span{display:none}
  .main{grid-template-columns:1fr}
  .schedule-card,.reviews-card{grid-column:1/span 1}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-logo">MB</div><strong id="brandName">Mineiro Barbershop</strong></div>
    <nav class="nav">
      <a href="index.html"><span>Dashboard</span></a>
      <a href="services.html"><span>Serviços</span></a>
      <a href="professionals.html"><span>Profissionais</span></a>
      <a href="clients.html"><span>Clientes</span></a>
    </nav>
    <div class="spacer"></div>
    <button class="btn" onclick="history.back()">Voltar</button>
  </aside>

  <header class="header">
    <div class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Buscar serviços deste profissional…" />
      <select id="dummy"><option>Perfil</option></select>
    </div>
    <div class="uinfo">
      <span class="name" id="userName">—</span><span class="uinfo tag">Cliente</span>
      <img class="avatar" id="userAvatar" alt="Usuário">
    </div>
  </header>

  <main class="main" id="content">
    <section class="card profile-card grid-full" id="profile">
      <div class="profile-avatar" id="proAvatar"><span class="muted">Foto</span></div>
      <div class="profile-head">
        <h1 id="proName">Profissional</h1>
        <div class="muted" id="proBranch">Unidade —</div>
        <div class="rating" id="proRating">
          <span class="star">★</span><b>0,0</b><span class="muted" id="proRatingCount">(0 avaliações)</span>
        </div>
        <div class="kpis">
          <div class="kpi"><small class="muted">Tempo médio</small><b id="kpiAvgMin">—</b></div>
          <div class="kpi"><small class="muted">Ticket médio</small><b id="kpiAvgTicket">—</b></div>
          <div class="kpi"><small class="muted">Serviços</small><b id="kpiServices">—</b></div>
        </div>
        <p class="muted" id="proBio" style="margin:8px 0 0">—</p>
        <div class="actions">
          <a id="btnWhats" class="btn btn-whatsapp" target="_blank" rel="noopener">WhatsApp</a>
          <button id="btnShare" class="btn btn-share">Compartilhar</button>
          <a id="btnBook" class="btn btn-primary">Agendar</a>
        </div>
      </div>
    </section>

    <section class="card services-card">
      <h3>Serviços</h3>
      <div id="services"></div>
    </section>

    <section class="card schedule-card">
      <h3>Agenda semanal</h3>
      <div class="week" id="week"></div>
    </section>

    <section class="card reviews-card grid-full">
      <h3>Avaliações recentes</h3>
      <div id="reviews"></div>
    </section>
  </main>
</div>

<script>
/* ===== Config Supabase ===== */
const SUPABASE_URL = 'https://rlhrnmzlfiyyycrhggjv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsaHJubXpsZml5eXljcmhnZ2p2Iiwicm9sZSI6InNlcnZpY2Vfcm9zZSIsImlhdCI6MTc1ODM2OTQ5MSwiZXhwIjoyMDczOTQ1NDkxfQ.tF5FGlO9vzK72LF0lUz5nZgevstzmQTePZEudrYM61Y';

function getSbSession() {
  const custom = localStorage.getItem('sb.session');
  if (custom) { try { const s = JSON.parse(custom); return { access_token: s.access_token||s.token||'', user_id: s.user_id||s.user?.id||'', user: s.user||null }; } catch{} }
  const ref = SUPABASE_URL.split('https://')[1].split('.')[0];
  const raw = localStorage.getItem(`sb-${ref}-auth-token`);
  if (raw) { try { const p = JSON.parse(raw); const sess = p?.currentSession || p; return { access_token: sess?.access_token||'', user_id: sess?.user?.id||'', user: sess?.user||null }; } catch{} }
  return null;
}
function initials(s=''){ s=String(s||'').trim(); if(!s) return '?'; const p=s.split(/\s+/); return (p.length>1?(p[0][0]+p[p.length-1][0]):p[0].slice(0,2)).toUpperCase(); }
const fmtBRL = v => (Number(v||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

/* ===== HTTP helper ===== */
async function sGet(path, bearer){
  const res = await fetch(`${SUPABASE_URL}${path}`, {
    headers:{ apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${bearer||SUPABASE_ANON_KEY}` }
  });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}

/* ===== Query param ===== */
const params = new URLSearchParams(location.search);
const professionalId = params.get('id');

/* ===== Header hydrate (brand + user mini info) ===== */
(async function hydrateHeader(){
  try{
    const sb = getSbSession();
    const userId = sb?.user_id;
    if (userId){
      const [p] = await sGet(`/rest/v1/profiles?id=eq.${userId}&select=full_name,avatar_url`, sb?.access_token);
      document.getElementById('userName').textContent = p?.full_name || 'Cliente';
      const av = document.getElementById('userAvatar');
      if (p?.avatar_url){ av.src = p.avatar_url; av.alt = p.full_name; } else { av.remove(); }
    }
    const b = await sGet(`/rest/v1/branches?is_active=eq.true&select=name&limit=1`);
    document.getElementById('brandName').textContent = b?.[0]?.name || 'Mineiro Barbershop';
  }catch(e){ console.warn(e); }
})();

/* ===== When no id: list professionals to choose ===== */
async function renderChooser(){
  const grid = document.getElementById('content');
  grid.innerHTML = `
    <section class="card grid-full"><h3>Escolha um profissional</h3><div id="gridPros" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px"></div></section>
  `;
  const pros = await sGet(`/rest/v1/professionals?is_active=eq.true&select=id,full_name,slug,phone,rating_avg,rating_count,branch_id,profile_id,${encodeURIComponent('profiles!inner(avatar_url)')}`);
  const wrap = document.getElementById('gridPros');
  wrap.innerHTML = pros.map(p=>{
    const img = p.profiles?.avatar_url ? `<img src="${p.profiles.avatar_url}" style="width:100%;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--line)">` :
      `<div style="width:100%;height:120px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:#101113;color:#cbd5e1;font:700 20px/1 Poppins">${initials(p.full_name)}</div>`;
    return `
      <a href="profiles.html?id=${p.id}" class="card" style="text-decoration:none;color:inherit">
        ${img}
        <div style="margin-top:8px"><b>${p.full_name}</b><br><span class="muted">${(p.rating_avg||0).toFixed(1)} ★ (${p.rating_count||0})</span></div>
      </a>
    `;
  }).join('');
}

/* ===== Main profile render ===== */
async function renderProfile(id){
  const sb = getSbSession();

  // professional
  const [pro] = await sGet(`/rest/v1/professionals?id=eq.${id}&select=id,full_name,bio,phone,branch_id,rating_avg,rating_count,${encodeURIComponent('profiles!inner(avatar_url)')}`, sb?.access_token);
  if(!pro){ document.getElementById('content').innerHTML = `<section class="card grid-full empty">Profissional não encontrado.</section>`; return; }

  // branch
  const branch = pro.branch_id ? (await sGet(`/rest/v1/branches?id=eq.${pro.branch_id}&select=name&limit=1`))?.[0]?.name : null;

  // services do profissional (e valores específicos)
  const servs = await sGet(`/rest/v1/service_professionals?professional_id=eq.${id}&select=price_cents,duration_min,service:services(id,name,slug,price_cents,duration_min,is_active)&order=service(name).asc`);
  const list = servs
    .filter(s => s.service?.is_active !== false)
    .map(s => ({
      id: s.service.id,
      name: s.service.name,
      price_cents: (s.price_cents ?? s.service.price_cents),
      duration_min: (s.duration_min ?? s.service.duration_min),
      slug: s.service.slug
    }));

  // kpis
  const avgMin = list.length ? Math.round(list.reduce((a,b)=>a+(b.duration_min||0),0)/list.length) : 0;
  const avgTicket = list.length ? Math.round(list.reduce((a,b)=>a+(b.price_cents||0),0)/list.length) : 0;

  // working hours
  const hours = await sGet(`/rest/v1/working_hours?professional_id=eq.${id}&select=weekday,start_time,end_time,slot_min&order=weekday.asc`);
  const weekdays = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  // reviews (ultimas 5)
  const revs = await sGet(`/rest/v1/reviews?professional_id=eq.${id}&select=rating,comment,created_at,customer:profiles(full_name,avatar_url)&order=created_at.desc&limit=5`);

  // paint header block
  document.getElementById('proName').textContent = pro.full_name || 'Profissional';
  document.getElementById('proBranch').textContent = branch ? `Unidade ${branch}` : '—';
  document.getElementById('proRating').innerHTML = `<span class="star">★</span><b>${(pro.rating_avg||0).toFixed(1)}</b><span class="muted" id="proRatingCount">(${pro.rating_count||0} avaliações)</span>`;
  document.getElementById('proBio').textContent = pro.bio || '—';
  document.getElementById('kpiAvgMin').textContent = avgMin ? `${avgMin} min` : '—';
  document.getElementById('kpiAvgTicket').textContent = avgTicket ? `${fmtBRL(avgTicket)}` : '—';
  document.getElementById('kpiServices').textContent = String(list.length||0);

  const av = document.getElementById('proAvatar');
  if (pro.profiles?.avatar_url){
    av.innerHTML = `<img src="${pro.profiles.avatar_url}" alt="${pro.full_name}">`;
  } else {
    av.innerHTML = `<div style="width:100%;height:100%;display:grid;place-items:center;color:#cbd5e1;font:800 42px/1 Poppins">${initials(pro.full_name)}</div>`;
  }

  const wa = document.getElementById('btnWhats');
  if (pro.phone){ wa.href = `https://wa.me/${pro.phone.replace(/\D/g,'')}?text=${encodeURIComponent('Olá! Quero agendar um horário.')}`; } else { wa.style.display='none'; }
  document.getElementById('btnBook').href = `booking.html?professional_id=${id}`;
  document.getElementById('btnShare').onclick = async () => {
    const url = location.href;
    try{
      if (navigator.share) await navigator.share({ title: pro.full_name, text: 'Perfil do profissional', url });
      else { await navigator.clipboard.writeText(url); alert('Link copiado!'); }
    }catch{}

  };

  // services
  const srvWrap = document.getElementById('services');
  if (!list.length){
    srvWrap.innerHTML = `<div class="empty">Nenhum serviço vinculado a este profissional.</div>`;
  } else {
    srvWrap.innerHTML = list.map(s => `
      <div class="service-row">
        <div><b>${s.name}</b></div>
        <div>${fmtBRL(s.price_cents||0)}</div>
        <div>${s.duration_min||'-'} min</div>
        <div style="text-align:right"><a class="badge badge-ok" href="booking.html?professional_id=${id}&service_id=${s.id}">Agendar</a></div>
      </div>
    `).join('');
  }

  // schedule
  const w = document.getElementById('week');
  const byDay = new Map();
  hours.forEach(h => {
    const arr = byDay.get(h.weekday) || [];
    arr.push(h);
    byDay.set(h.weekday, arr);
  });
  w.innerHTML = Array.from({length:7}).map((_,i)=>{
    const items = (byDay.get(i)||[]).map(h=>`<div class="slot">${h.start_time?.slice(0,5)} – ${h.end_time?.slice(0,5)}</div>`).join('') || `<div class="slot off">Sem expediente</div>`;
    return `<div class="day"><h4>${weekdays[i]}</h4>${items}</div>`;
  }).join('');

  // reviews
  const revWrap = document.getElementById('reviews');
  if (!revs.length){
    revWrap.innerHTML = `<div class="empty">Este profissional ainda não possui avaliações.</div>`;
  } else {
    revWrap.innerHTML = revs.map(r=>{
      const av = r.customer?.avatar_url
        ? `<img src="${r.customer.avatar_url}" alt="${r.customer.full_name}">`
        : `<div class="avatar">${initials(r.customer?.full_name)}</div>`;
      const stars = Array.from({length:5}).map((_,i)=>`<span class="star" style="color:${i<r.rating?'#ffd166':'#3a3d44'}">★</span>`).join('');
      const when = new Date(r.created_at).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
      return `
        <div class="review">
          <div class="reviewer">
            <div class="avatar">${av}</div>
            <div><b>${r.customer?.full_name || 'Cliente'}</b><div class="muted">${when}</div></div>
            <div class="stars" style="margin-left:auto">${stars}</div>
          </div>
          <div style="margin-top:8px">${r.comment ? r.comment : '<span class="muted">Sem comentário.</span>'}</div>
        </div>
      `;
    }).join('');
  }
}

/* ===== Boot ===== */
(async function boot(){
  if (!professionalId){ await renderChooser(); return; }
  try{
    await renderProfile(professionalId);
  }catch(e){
    console.error(e);
    document.getElementById('content').innerHTML = `<section class="card grid-full empty">Erro ao carregar perfil.</section>`;
  }
})();
</script>
</body>
</html>
